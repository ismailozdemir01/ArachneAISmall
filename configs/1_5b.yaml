model:
  vocab_size: 32000
  d_model: 2048
  n_layers: 24
  n_heads: 16
  n_kv_heads: 4
  max_seq_len: 4096
  intermediate_size: 5632
  rope_theta: 10000.0
  norm_eps: 0.00001
  tie_embeddings: false
training:
  seed: 1337
  batch_size: 1
  gradient_accumulation_steps: 128
  max_steps: 300000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 2000
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  save_interval: 1000
  precision: bf16
  num_workers: 2
  output_dir: artifacts/arachne-small-1.5b

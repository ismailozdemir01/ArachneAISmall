[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arachneai-small"
version = "0.1.0"
description = "From-scratch Turkish-English decoder-only language model training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "sentencepiece>=0.2.0", "PyYAML>=6.0", "safetensors>=0.4.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arachne-small = "arachne_small.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
